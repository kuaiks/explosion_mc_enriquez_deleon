[project]
name = "explosion-mc-deleon-enriquez"
version = "0.1.0"
description = "Proyecto Simulacion"
authors = [
    {name = "Esdras de Leon, Daniel Enriquez"}
]
requires-python = ">=3.12"
dependencies = [
    "pyyaml (>=6.0.3,<7.0.0)",
    "matplotlib (>=3.10.9,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)"
]
